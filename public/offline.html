<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>You're offline - eFootball Arena Kenya</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #f4f7ff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
    main { max-width: 420px; }
    img { width: 96px; height: 96px; }
    h1 { font-size: 1.6rem; margin: 16px 0 8px; }
    p { color: #9aa6c4; line-height: 1.5; margin: 0 0 20px; }
    button { background: #4ff08a; color: #04210f; border: 0; border-radius: 10px; padding: 12px 22px; font-weight: 700; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" width="96" height="96">
    <h1>You're offline</h1>
    <p>Fixtures, results and the league table need an internet connection. Check your data or Wi-Fi and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
